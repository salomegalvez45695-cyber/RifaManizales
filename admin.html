<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Rifa</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="admin-container" style="padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%;">
    <header style="text-align: center; margin-bottom: 25px;">
      <h2>Panel de Control</h2>
      <p class="subtitle">Gestión de pagos y números apartados para tu mami</p>
    </header>

    <div style="width: 100%; max-width: 850px; overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="admin-table">
          <!-- Contenido dinámico en tiempo real -->
          <tr><td colspan="5" style="text-align:center; color:#777; padding: 20px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDK Clásico (Versión 8.10.1) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Script general (usa exactamente el mismo app.js que ya probamos y funciona) -->
  <script src="js/app.js"></script>
</body>
</html>
