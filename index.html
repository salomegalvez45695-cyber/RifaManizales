  <!-- Modal para Apartar -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Apartar Número <span id="modal-num"></span></h3>
      <form id="reserve-form">
        <label>Nombre Completo:</label>
        <input type="text" id="nombre" required placeholder="Ej. Sofía Betancurt">
        
        <label>Número de WhatsApp:</label>
        <input type="tel" id="telefono" required placeholder="Ej. 3101234567">
        
        <div class="modal-buttons">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-submit">Confirmar</button>
        </div>
      </form>
    </div>
